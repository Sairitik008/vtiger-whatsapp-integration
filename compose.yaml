services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VTIGER_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./vtigercrm:/var/www/html
    environment:
      WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-mock}
      WHATSAPP_LIVE_SEND_ENABLED: ${WHATSAPP_LIVE_SEND_ENABLED:-0}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN_FILE: ${WHATSAPP_ACCESS_TOKEN_FILE:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_APP_SECRET_FILE: ${WHATSAPP_APP_SECRET_FILE:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN_FILE: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN_FILE:-}
      WHATSAPP_SYSTEM_USER_ID: ${WHATSAPP_SYSTEM_USER_ID:-}
    extra_hosts:
      - "stats.vtiger.com:127.0.0.1"

  whatsapp-worker:
    build:
      context: .
    command: ["php", "modules/WhatsApp/worker.php"]
    user: www-data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - whatsapp-worker
    restart: unless-stopped
    volumes:
      - ./vtigercrm:/var/www/html
    environment:
      WHATSAPP_TRANSPORT: ${WHATSAPP_TRANSPORT:-mock}
      WHATSAPP_LIVE_SEND_ENABLED: ${WHATSAPP_LIVE_SEND_ENABLED:-0}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN_FILE: ${WHATSAPP_ACCESS_TOKEN_FILE:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_APP_SECRET_FILE: ${WHATSAPP_APP_SECRET_FILE:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN_FILE: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN_FILE:-}
      WHATSAPP_SYSTEM_USER_ID: ${WHATSAPP_SYSTEM_USER_ID:-}

  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${VTIGER_DB_NAME:-vtiger}
      MYSQL_PASSWORD: ${VTIGER_DB_PASSWORD:?Set VTIGER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${VTIGER_DB_USER:-vtiger}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
